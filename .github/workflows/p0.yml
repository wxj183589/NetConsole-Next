name: G1 Build and Linux Recovery Tests
on:
  push:
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/NetConsole.Next.Service/NetConsole.Next.Service.csproj -c Release
      - run: dotnet build src/NetConsole.Next.LocalManager/NetConsole.Next.LocalManager.csproj -c Release
      - run: dotnet build src/NetConsole.Next.DesktopHelper/NetConsole.Next.DesktopHelper.csproj -c Release
      - run: dotnet run --project src/NetConsole.Next.LocalManager/NetConsole.Next.LocalManager.csproj -c Release -- --help
      - run: dotnet run --project tests/NetConsole.Next.Service.Tests/NetConsole.Next.Service.Tests.csproj -c Release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright --version
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: python -m pip install --disable-pip-version-check --requirement tests/requirements-ssh-protocol.txt
      - run: python tests/ssh_protocol_sim.py tests/NetConsole.Next.Service.Tests/bin/Release/net10.0/NetConsole.Next.Service.Tests.dll
      - run: python3 tests/smoke.py
      - run: python3 tests/web_auth_e2e.py
      - run: python3 tests/p2b3_read_api_e2e.py
      - run: python3 tests/g1_recovery.py
      - run: python3 tests/web_pr2_contract.py
      - run: python3 tests/web_pr2_e2e.py
      - run: python tests/terminal_ui_contract.py
      - run: python tests/terminal_e2e.py
        env:
          NETCONSOLE_NEXT_E2E_DATA_PARENT: ${{ runner.temp }}
      - run: python3 tests/udp_trace_benchmark_tests.py
      - run: python3 tests/perf_baseline.py --packets 10000 --queue-burst 0 --history-files 100 --sqlite-writes 100 --idle-seconds 1 --rate 5000
      - run: python3 tests/udp_trace_benchmark.py --pps 500 --payload-bytes 128 --duration-seconds 1 --require-lossless --output /tmp/netconsole-next-ci-udp-trace.json
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/NetConsole.Next.Service/NetConsole.Next.Service.csproj -c Release
      - run: dotnet build src/NetConsole.Next.LocalManager/NetConsole.Next.LocalManager.csproj -c Release
      - run: dotnet build src/NetConsole.Next.DesktopHelper/NetConsole.Next.DesktopHelper.csproj -c Release
      - run: dotnet run --project src/NetConsole.Next.LocalManager/NetConsole.Next.LocalManager.csproj -c Release -- --help
      - run: dotnet run --project tests/NetConsole.Next.Service.Tests/NetConsole.Next.Service.Tests.csproj -c Release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright --version
        working-directory: web
      - run: npx playwright install chromium
        working-directory: web
      - run: python -m pip install --disable-pip-version-check --requirement tests/requirements-ssh-protocol.txt
      - run: python tests/ssh_protocol_sim.py tests/NetConsole.Next.Service.Tests/bin/Release/net10.0/NetConsole.Next.Service.Tests.dll
      - run: python tests/terminal_ui_contract.py
      - run: python3 tests/web_pr2_contract.py
      - run: python3 tests/web_auth_e2e.py
      - run: python3 tests/p2b3_read_api_e2e.py
      - run: python tests/terminal_e2e.py
        env:
          NETCONSOLE_NEXT_E2E_DATA_PARENT: ${{ runner.temp }}
      - name: Publish, install, and exercise Windows Service through SCM
        shell: pwsh
        run: ./tests/windows_service_lifecycle.ps1
